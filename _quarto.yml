project:
  type: manuscript
  output-dir: docs

manuscript:
  resources:
    - references.bib
    - precompute.py
    - algorithms.py
    - routing_viz.py
  notebooks:
    - notebook: code/precompute.qmd
      title: Precompute pipeline
    - notebook: code/algorithms.qmd
      title: Pathfinding algorithms
    - notebook: code/routing_viz.qmd
      title: Visualization helpers
  code-links:
    - text: Precompute pipeline
      icon: file-code
      href: precompute.py
    - text: Pathfinding algorithms
      icon: file-code
      href: algorithms.py
    - text: Visualization helpers
      icon: file-code
      href: routing_viz.py

format:
  html:
    toc: true
    toc-depth: 3
    code-fold: true
    embed-resources: false
    self-contained: false
    theme: cosmo

execute:
  echo: true
  warning: false
  freeze: auto

jupyter: python3
